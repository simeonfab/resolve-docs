<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap Onboarding — Conversational Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A1A18;
    --ink-soft: #4A4A44;
    --ink-ghost: #9A9A92;
    --surface: #F2EDE4;
    --card-bg: #FFFFFF;
    --border: #DDD8CE;
    --amber: #C8A040;
    --terracotta: #8B4A2A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--surface);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .note-banner {
    background: #FFF8E1;
    border: 1px solid var(--amber);
    color: var(--ink-soft);
    font-size: 13px;
    padding: 10px 16px;
    text-align: center;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    min-height: 100vh;
  }
  .progress {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }
  .dot {
    height: 4px;
    flex: 1;
    border-radius: 2px;
    background: var(--border);
  }
  .dot.done { background: var(--amber); }
  .dot.current { background: var(--ink); }

  .step-label {
    color: var(--terracotta);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* The stacked-card look — a peek of the next card behind */
  .card-stack {
    position: relative;
    margin-bottom: 28px;
  }
  .card-behind {
    position: absolute;
    top: 12px;
    left: 8px;
    right: -8px;
    bottom: -12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    opacity: 0.6;
    z-index: 1;
  }
  .card-main {
    position: relative;
    z-index: 2;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }
  .card-question {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    line-height: 1.4;
    margin: 0 0 20px;
    color: var(--ink);
  }
  .card-question .highlight {
    background: linear-gradient(180deg, transparent 60%, rgba(200,160,64,0.35) 60%);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    background: #FAFAF7;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s;
  }
  .option:hover { border-color: var(--amber); }
  .option.selected {
    border-color: var(--amber);
    background: #FBF5E8;
    font-weight: 600;
  }
  .type-own {
    font-size: 13px;
    color: var(--ink-ghost);
    text-align: center;
    padding: 8px;
    border-top: 1px dashed var(--border);
    margin-top: 4px;
    cursor: pointer;
  }

  .card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn-next {
    background: var(--amber);
    color: var(--ink);
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-back {
    background: none;
    border: none;
    color: var(--ink-ghost);
    font-size: 13px;
    cursor: pointer;
  }

  .theme-counter {
    text-align: center;
    color: var(--ink-ghost);
    font-size: 13px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="note-banner">MOCKUP — conversational one-at-a-time flow. Not the real app.</div>
<div class="page">

  <div class="progress">
    <div class="dot done"></div>
    <div class="dot current"></div>
    <div class="dot"></div>
  </div>

  <div class="step-label">Theme 1 of 3</div>

  <div class="card-stack">
    <div class="card-behind"></div>
    <div class="card-main">
      <p class="card-question">We think you're aiming to <span class="highlight">finalize the brand name</span> from the three shortlisted options. Is that right?</p>

      <div class="options">
        <div class="option selected">Yes, that's right</div>
        <div class="option">Close, but adjust it</div>
      </div>
      <div class="type-own">or type your own goal instead</div>

      <div class="card-actions">
        <button class="btn-back">Back</button>
        <button class="btn-next">Next: definition of done →</button>
      </div>
    </div>
  </div>

  <div class="theme-counter">Reviewing 3 themes to start — you can add more later</div>

</div>
</body>
</html>
